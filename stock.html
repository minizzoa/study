<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock AI Mobile - Optimized</title>
    <style>
        :root { --green: #00cf8d; --red: #ff4d4d; --bg: #000000; --card: #1c1c1e; --input-bg: #2c2c2e; --accent: #007aff; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); color: #ffffff; margin: 0; padding: 15px;
            display: flex; justify-content: center;
        }

        .container { width: 100%; max-width: 480px; }

        .header-info { 
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 0 5px;
        }
        .api-counter { font-size: 11px; color: #8e8e93; }
        .api-counter span { color: var(--green); font-weight: bold; }

        h2 { font-size: 20px; font-weight: 700; margin: 0 0 15px 0; letter-spacing: -0.5px; }

        /* 종목 탭 - 정확히 5개씩 2줄 나열 */
        .top-stocks { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); /* 5열 고정 */
            gap: 6px; 
            margin-bottom: 20px;
        }
        .stock-tab { 
            background: var(--input-bg); border: none;
            padding: 10px 2px; border-radius: 8px; 
            color: #eee; font-size: 11px; font-weight: 600;
            text-align: center; cursor: pointer;
        }
        .stock-tab:active { background: #3a3a3c; transform: scale(0.95); }

        .input-group { display: flex; flex-direction: column; gap: 10px; }
        input { 
            width: 100%; height: 50px; background: var(--input-bg); border: none;
            border-radius: 12px; color: white; padding: 0 15px; box-sizing: border-box;
            font-size: 15px; outline: none;
        }
        .btn-group { display: flex; gap: 8px; }
        button { 
            height: 50px; border-radius: 12px; border: none; font-weight: 600; 
            font-size: 15px; transition: transform 0.1s;
        }
        .btn-main { background: var(--green); color: #000; flex: 2; }
        .btn-refresh { background: #3a3a3c; color: #fff; flex: 1; }

        #status { font-size: 12px; color: #ffd60a; margin: 12px 0; text-align: center; min-height: 15px; }

        /* 결과 카드 디자인 수정 */
        .result-box { 
            display: none; background: var(--card); padding: 20px; border-radius: 18px; 
            margin-bottom: 20px; border: 1px solid #2c2c2e;
        }

        .cache-badge { float: right; font-size: 9px; color: #8e8e93; border: 1px solid #3a3a3c; padding: 2px 6px; border-radius: 4px; }
        .price-val { font-size: 28px; font-weight: 700; margin: 10px 0 5px 0; color: #fff; } /* 현재가 폰트 축소 */
        
        /* 강도 지표 포인트 색상 적용 */
        .intensity-box {
            display: inline-block; padding: 4px 10px; border-radius: 6px; 
            background: #2c2c2e; font-size: 14px; font-weight: 600;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .grid-item { background: #2c2c2e; padding: 12px; border-radius: 12px; }
        .grid-label { font-size: 10px; color: #8e8e93; margin-bottom: 4px; }
        .grid-value { font-size: 16px; font-weight: 700; }

        .rsi-guide { 
            background: #1c1c1e; padding: 15px; border-radius: 18px; 
            font-size: 12px; color: #8e8e93; line-height: 1.5;
        }
        .rsi-guide h4 { color: #fff; margin: 0 0 10px 0; font-size: 14px; }
        .guide-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .dot { width: 7px; height: 7px; border-radius: 50%; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-info">
        <div class="api-counter">API 호출: <span id="call-count">0</span>회</div>
        <div style="font-size: 10px; color:#8e8e93;">3시간 캐시 적용</div>
    </div>
    
    <h2>AI 주식 전략가</h2>
    
    <div class="top-stocks">
        <div class="stock-tab" onclick="quickSearch('005930.KS')">삼성전자</div>
        <div class="stock-tab" onclick="quickSearch('000660.KS')">하이닉스</div>
        <div class="stock-tab" onclick="quickSearch('086520.KQ')">에코프로</div>
        <div class="stock-tab" onclick="quickSearch('247540.KQ')">에코BM</div>
        <div class="stock-tab" onclick="quickSearch('373220.KS')">LG엔솔</div>
        <div class="stock-tab" onclick="quickSearch('005380.KS')">현대차</div>
        <div class="stock-tab" onclick="quickSearch('207940.KS')">삼바</div>
        <div class="stock-tab" onclick="quickSearch('068270.KS')">셀트리온</div>
        <div class="stock-tab" onclick="quickSearch('005490.KS')">포스코</div>
        <div class="stock-tab" onclick="quickSearch('000270.KS')">기아</div>
    </div>

    <div class="input-group">
        <input type="text" id="symbol" placeholder="종목코드 직접 입력" inputmode="text">
        <div class="btn-group">
            <button class="btn-main" onclick="analyze(false)">분석하기</button>
            <button class="btn-refresh" onclick="analyze(true)">🔄</button>
        </div>
    </div>

    <div id="status"></div>

    <div id="result-box" class="result-box">
        <span id="cache-info" class="cache-badge">LIVE</span>
        <div id="res-name" style="color:#8e8e93; font-size:12px;">종목 정보</div>
        <div id="res-price" class="price-val">-</div> <div style="font-size:13px; color:#aaa;">
            RSI 강도: <span id="res-rsi-box" class="intensity-box"><span id="res-rsi">-</span></span>
        </div>

        <div class="grid">
            <div class="grid-item">
                <div class="grid-label">매수 타점(지지)</div>
                <div id="buy-price" class="grid-value" style="color:var(--green);">-</div>
            </div>
            <div class="grid-item">
                <div class="grid-label">매도 타점(저항)</div>
                <div id="sell-price" class="grid-value" style="color:var(--red);">-</div>
            </div>
        </div>
    </div>

    <div class="rsi-guide">
        <h4>💡 지표 가이드</h4>
        <div class="guide-item"><div class="dot" style="background:var(--red)"></div> 70↑ 과매수 (분할 매도 구간)</div>
        <div class="guide-item"><div class="dot" style="background:var(--green)"></div> 30↓ 과매도 (분할 매수 구간)</div>
    </div>
</div>

<script>
const CACHE_TIME = 3 * 60 * 60 * 1000; 
const apiKey = '91ddc9b5afmshdcc42e8dbcb14ecp14535bjsn920f0dd4979d'; // ⚠️ RapidAPI 키를 입력하세요.

let callCount = localStorage.getItem('api_call_count') || 0;
document.getElementById('call-count').innerText = callCount;

function quickSearch(code) {
    document.getElementById('symbol').value = code;
    analyze(false);
}

function updateCallCount() {
    callCount++;
    localStorage.setItem('api_call_count', callCount);
    document.getElementById('call-count').innerText = callCount;
}

async function analyze(isRefresh) {
    const symbol = document.getElementById('symbol').value.trim().toUpperCase();
    const status = document.getElementById('status');
    const resultBox = document.getElementById('result-box');

    if(!symbol) return;

    const cacheKey = 'cache_' + symbol;
    const cachedData = localStorage.getItem(cacheKey);
    const now = new Date().getTime();

    if (!isRefresh && cachedData) {
        const parsed = JSON.parse(cachedData);
        if (now - parsed.timestamp < CACHE_TIME) {
            displayData(parsed.data, symbol, true);
            status.innerText = "💡 3시간 내 캐시 데이터입니다.";
            return;
        }
    }

    status.innerText = "📡 데이터 분석 중...";
    try {
        const url = `https://yh-finance.p.rapidapi.com/stock/v3/get-chart?interval=1d&symbol=${symbol}&range=1mo&region=KR`;
        const res = await fetch(url, { headers: { 'x-rapidapi-key': apiKey, 'x-rapidapi-host': 'yh-finance.p.rapidapi.com' } });
        const json = await res.json();
        
        if (!json.chart.result) throw new Error("종목 없음");
        const data = json.chart.result[0];

        updateCallCount();
        localStorage.setItem(cacheKey, JSON.stringify({ timestamp: now, data: data }));

        displayData(data, symbol, false);
        status.innerText = "✅ 최신 데이터 갱신 완료";
    } catch (e) {
        status.innerText = "❌ 정보를 찾을 수 없습니다.";
    }
}

function displayData(data, symbol, fromCache) {
    const currentPrice = data.meta.regularMarketPrice;
    const closes = data.indicators.quote[0].close.filter(p => p != null).reverse();
    
    let gains = 0, losses = 0;
    for (let i = 0; i < 14; i++) {
        let diff = closes[i] - closes[i+1];
        if (diff > 0) gains += diff; else losses -= diff;
    }
    const rsi = 100 - (100 / (1 + (gains / Math.abs(losses || 1))));

    document.getElementById('res-name').innerText = symbol;
    document.getElementById('res-price').innerText = currentPrice.toLocaleString() + " " + (data.meta.currency || 'KRW');
    
    // 강도 포인트 색상 처리
    const rsiVal = rsi.toFixed(2);
    const rsiElem = document.getElementById('res-rsi');
    const rsiBox = document.getElementById('res-rsi-box');
    rsiElem.innerText = rsiVal;
    
    if (rsi >= 70) {
        rsiBox.style.color = 'var(--red)';
        rsiBox.style.background = 'rgba(255, 77, 77, 0.15)';
    } else if (rsi <= 30) {
        rsiBox.style.color = 'var(--green)';
        rsiBox.style.background = 'rgba(0, 207, 141, 0.15)';
    } else {
        rsiBox.style.color = '#fff';
        rsiBox.style.background = '#2c2c2e';
    }

    document.getElementById('buy-price').innerText = Math.round(currentPrice * 0.96).toLocaleString();
    document.getElementById('sell-price').innerText = Math.round(currentPrice * 1.07).toLocaleString();
    document.getElementById('cache-info').innerText = fromCache ? "CACHED" : "LIVE";
    
    document.getElementById('result-box').style.display = 'block';
}
</script>

</body>
</html>
